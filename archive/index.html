<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>往期归档 · 考公资讯日报</title>
<meta name="description" content="每天把国考、省考、事业单位的招考公告和截止节点做成一份可核对的日报">

<style>
*{margin:0;padding:0;box-sizing:border-box}
/* ── 设计令牌 ───────────────────────────────────────────────────────────
   来源：ui-ux-pro-max 的 "Swiss Modernism 2.0 + 暖纸" 方案（warm paper white
   + ink brown + amber accent）。两处按实测改了它的值，写在下面各自位置。

   全部色值都在这里，规则里一个裸色值都不留（它的 checklist 第一条就是
   「禁止逐屏硬编码颜色」，上一版规则里还有 3 处裸值，这次一并收进来）。 */
:root{
  --paper:#FFFBEB;      /* 底：暖纸白 */
  --ink:#0F172A;        /* 正文墨色 */
  --stone:#78716C;      /* 石色（只用于装饰笔画，不用于正文，对比度不够） */
  --stone-ink:#57534E;  /* 弱化文字用这个：在纸底上约 7:1，--stone 只有 4.3:1 */
  --amber:#D97706;      /* 强调色：分隔线、色块、hover */
  --amber-ink:#92400E;  /* 链接色：纸底上约 6.4:1，可直接当正文链接 */
  --line:#E5E0D6;
  --card:#FFFFFF;
  --band:#F7F2E7;       /* 表头/引用块底色 */
  --zebra:#FAF7F0;      /* 表格隔行 */
  --focus:#B45309;      /* 焦点环 */
  --ink-strong:#000000; /* 强调字：比正文更重的黑 */

  /* 字号五档。正文提到 17px：中文长文 16px 在 700px 行宽下每行 40 字，
     17px 配 1.85 行高更适合连着看几十条公告。 */
  --fs-xs:13px;--fs-md:17px;--fs-lg:20px;--fs-xl:26px;--fs-2xl:32px;

  /* 间距八档，全部 4 的倍数（沿用插件给的刻度，去掉它没用的 3 档） */
  --sp-1:4px;--sp-2:8px;--sp-3:16px;--sp-4:24px;--sp-5:32px;
  --sp-6:48px;--sp-7:64px;--sp-8:96px;

  --radius:10px;
  --radius-pill:999px;
}
body{background:var(--paper);color:var(--ink);font-size:var(--fs-md);line-height:1.85;
  /* 字体不照抄它给的 Inter/Playfair Display：两者都没有中文字形，
     中文会掉回系统字体，中英混排的行高基线会漂。中文字族用 Noto Sans SC。 */
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei UI",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* 行宽：720px 容器减左右 32px = 656px 正文，17px 字约 38 字一行，
   落在中文长文最舒服的 38–42 区间。 */
.wrap{max-width:720px;margin:0 auto;padding:var(--sp-7) var(--sp-5) var(--sp-8)}
a{color:var(--amber-ink);text-decoration:none;
  text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration:underline}
a:focus-visible,summary:focus-visible,button:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--sp-1)}
header.top{border-bottom:1px solid var(--line);padding-bottom:var(--sp-4);
  margin-bottom:var(--sp-5)}
header.top h1{font-size:var(--fs-2xl);letter-spacing:.5px;line-height:1.35;
  font-weight:700;display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
/* 标题前的色块：瑞士风格的网格感，不用阴影不用渐变 */
header.top h1::before{content:"";width:6px;height:.95em;background:var(--amber);
  border-radius:2px;display:inline-block;flex:none}
header.top .sub{color:var(--stone-ink);font-size:var(--fs-md);margin-top:var(--sp-2)}
.meta{color:var(--stone-ink);font-size:var(--fs-xs);letter-spacing:.3px}
h2.sec{font-size:var(--fs-lg);color:var(--ink);margin:var(--sp-6) 0 var(--sp-3);
  letter-spacing:.5px;line-height:1.4;padding-bottom:var(--sp-2);
  border-bottom:2px solid var(--ink)}
h2.sec::before{content:"§";color:var(--amber);margin-right:var(--sp-2);font-weight:400}
.item{padding:var(--sp-4) 0;border-bottom:1px solid var(--line);scroll-margin-top:var(--sp-3)}
.item:last-child{border-bottom:none}
.item h3{font-size:var(--fs-lg);line-height:1.55;font-weight:700;letter-spacing:.1px}
.item h3 a{color:var(--ink)}
.item h3 a:hover{color:var(--amber-ink);text-decoration:none}
.item .src{color:var(--stone-ink);font-size:var(--fs-xs);margin-top:var(--sp-2);
  display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:var(--sp-1) var(--sp-3);border-radius:var(--radius-pill);
  font-size:var(--fs-xs);background:var(--band);color:var(--amber-ink);
  border:1px solid var(--line)}
.tag.t2{background:var(--card);color:var(--stone-ink)}
blockquote{margin:var(--sp-3) 0 0;padding:var(--sp-3) var(--sp-4);
  border-left:3px solid var(--amber);background:var(--band);
  border-radius:0 var(--radius) var(--radius) 0;
  color:var(--ink);font-size:var(--fs-md);line-height:1.75}
details{margin-top:var(--sp-3)}
details summary{cursor:pointer;color:var(--stone-ink);font-size:var(--fs-md);
  user-select:none;min-height:var(--sp-5);display:flex;align-items:center;gap:var(--sp-2)}
details summary:hover{color:var(--amber-ink)}
details summary::marker{color:var(--amber)}
.body{margin-top:var(--sp-3);font-size:var(--fs-md);color:var(--ink)}
.body p{margin:var(--sp-3) 0}
.body strong{color:var(--ink-strong);font-weight:700}
.body code{background:var(--band);padding:0 var(--sp-1);border-radius:var(--sp-1);
  font-size:var(--fs-xs);color:var(--amber-ink)}
/* 表格：宽表向两侧出血，手机上横向滚动，正文列仍保持窄 */
.tw{overflow-x:auto;margin:var(--sp-3) calc(-1 * var(--sp-5));
  border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.tw table{border-collapse:collapse;width:100%;font-size:var(--fs-xs);min-width:560px;
  line-height:1.65}
.tw th{background:var(--band);color:var(--ink);font-weight:700;text-align:left;
  padding:var(--sp-2) var(--sp-3);white-space:nowrap;
  border-bottom:1px solid var(--line);letter-spacing:.3px}
.tw td{padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--line);
  vertical-align:top;color:var(--ink)}
.tw tr:last-child td{border-bottom:none}
.tw tr:nth-child(even) td{background:var(--zebra)}
.tw td:first-child{color:var(--stone-ink);font-variant-numeric:tabular-nums;
  white-space:nowrap}
/* 短单元格不许折行：避免"天津财经 / 大学""10月26 / 日"这种断字 */
.tw td.nw{white-space:nowrap}
/* 表内网址：13px 字形盒只有 19 高，低于 WCAG 2.5.8 的 24×24 硬线，
   补 min-height 把命中区抬到 24。 */
.tw td a{word-break:break-all;color:var(--amber-ink);
  display:inline-flex;align-items:center;min-height:var(--sp-4)}
ol.idx{list-style:none}
ol.idx li{padding:var(--sp-2) 0;border-bottom:1px solid var(--line);font-size:var(--fs-md);
  display:flex;gap:var(--sp-3);align-items:baseline}
ol.idx li .d{color:var(--stone-ink);font-size:var(--fs-xs);flex:none;
  font-variant-numeric:tabular-nums}
ol.idx li a{color:var(--ink)}
ol.idx li a:hover{color:var(--amber-ink)}
/* 进度：国考这条线（左边的点只作辅助，状态一律写成字）+ 待盯的日子 */
.steps{display:flex;flex-direction:column;gap:var(--sp-1)}
.step{display:flex;align-items:center;gap:12px;padding:9px var(--sp-3);
  border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  font-size:var(--fs-md);line-height:1.5}
.step .s{width:10px;height:10px;border-radius:50%;background:var(--stone);flex:none}
.step.done .s,.step.past .s{opacity:.5}
.step.upcoming .s{background:var(--amber)}
.step.today{border-color:var(--amber);background:var(--band)}
.step.today .s{background:var(--amber);box-shadow:0 0 0 4px rgba(217,119,6,.16)}
.step b{font-weight:600;flex:1 1 auto;min-width:0}
.step .w{flex:none;font-weight:700}
.step.unknown .w,.step.gap .w{color:var(--stone-ink);font-weight:500}
.step a,.step .o{flex:none;font-size:var(--fs-xs);color:var(--stone-ink);
  max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-height:24px;display:inline-flex;align-items:center}
.days{list-style:none;display:flex;flex-direction:column;gap:var(--sp-1)}
.days li{display:flex;align-items:baseline;gap:12px;padding:9px var(--sp-3);
  border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  font-size:var(--fs-md)}
.days .dd{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.days .dn{flex:none;font-size:var(--fs-xs);color:var(--amber-ink);min-width:52px}
.days a{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-height:24px;display:inline-flex;align-items:center}
.days .dg{flex:1 1 auto;text-align:right;font-size:var(--fs-xs);color:var(--stone-ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:var(--stone-ink);font-size:var(--fs-md);margin-top:var(--sp-3);  padding:var(--sp-3) var(--sp-4);background:var(--band);
  border-radius:var(--radius);border:1px solid var(--line)}
footer{margin-top:var(--sp-7);padding-top:var(--sp-4);border-top:1px solid var(--line);
  color:var(--stone-ink);font-size:var(--fs-xs);line-height:1.8}
footer p{margin:var(--sp-2) 0}
.kv{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin:var(--sp-3) 0}
.kv span{padding:var(--sp-2) var(--sp-3);border-radius:var(--radius);background:var(--card);
  border:1px solid var(--line);font-size:var(--fs-xs);color:var(--stone-ink)}
.kv b{color:var(--ink);font-size:var(--fs-lg);margin-right:var(--sp-1);
  font-variant-numeric:tabular-nums}
/* 指尖命中区：行内链接补够 32px 高与左右余量，视觉上仍是一行字 */
.src a,.idx li a[href*="http"],footer a,.kv a{display:inline-flex;align-items:center;
  min-height:var(--sp-5);padding:0 var(--sp-2);margin:0 calc(-1 * var(--sp-2))}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
}
@media (max-width:760px){
  .wrap{padding:var(--sp-5) var(--sp-3) var(--sp-7)}
  .tw{margin-left:calc(-1 * var(--sp-3));margin-right:calc(-1 * var(--sp-3))}
  header.top h1{font-size:var(--fs-xl)}
  h2.sec{font-size:var(--fs-md)}
}
/* 深色偏好下反色：只在系统明确要求时生效，默认仍是暖纸 */
@media (prefers-color-scheme:dark){
  :root{--paper:#12100C;--ink:#EDE6DA;--stone-ink:#A8A29E;--line:#2A2622;
        --card:#1A1713;--band:#1F1B16;--zebra:#191510;--amber:#F59E0B;
        --amber-ink:#FBBF24;--focus:#FBBF24}
  .body strong{color:var(--paper)}
}
